<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagicTask - Sistema Educacional Gamificado</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
@keyframes magicGlow { 0% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); } 50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.8); } 100% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); } }
.animate-float { animation: float 3s ease-in-out infinite; }
.animate-magic-glow { animation: magicGlow 2s ease-in-out infinite; }
.xp-badge { background: linear-gradient(135deg, #8B5CF6 0%, #C084FC 50%, #E879F9 100%); }
.magic-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); }
.btn-magic { background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%); transition: all 0.3s ease; }
.btn-magic:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5); }
.avatar-card { transition: all 0.3s ease; cursor: pointer; }
.avatar-card:hover { transform: scale(1.05); box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5); }
.selected-avatar { border: 4px solid #8B5CF6; box-shadow: 0 0 20px rgba(139, 92, 246, 0.8); transform: scale(1.02); }
.locked-item { filter: grayscale(1) brightness(0.5); opacity: 0.6; cursor: not-allowed; position: relative; }
.locked-item::after { content: "🔒"; position: absolute; font-size: 30px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
.main-avatar { width: 200px; height: 200px; margin: 0 auto; border-radius: 30px; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.3); }
.main-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; }
.avatar-thumb { width: 80px; height: 80px; border-radius: 16px; overflow: hidden; margin: 0 auto; }
.avatar-thumb img { width: 100%; height: 100%; object-fit: cover; }
.avatar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px; max-height: 350px; overflow-y: auto; padding: 10px; }
.logo-placeholder { width: 160px; height: 160px; margin: 0 auto 20px auto; background: linear-gradient(135deg, #8B5CF6 20%, #C084FC 50%, #E879F9 80%); border-radius: 40px; display: flex; align-items: center; justify-content: center; font-size: 42px; font-weight: bold; color: white; box-shadow: 0 15px 30px -10px rgba(139, 92, 246, 0.5); }
.correct-answer { background-color: #dcfce7; border-left: 4px solid #22c55e; }
.wrong-answer { background-color: #fee2e2; border-left: 4px solid #ef4444; }
</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
<div id="app"></div>

<script>
// ==================== IMAGENS DO DRIVE ====================
const IMAGE_IDS = {
    base: '1wjggB2f39kGo-O6X3R40ZTEx427V8AFz', soldado: '1_ifhr8fNdVp-IFDeEf9hqbqItlVXDrPD', ninja: '1L1KyMIAsGvrHECp9hjzA9XTxhqoX7wa2',
    bruxa: '1m8nN9ouhloFj1DpPV_k-9ddKKrNkP33K', feiticeiro: '1qqNLDjJp5IQHXpK-1CyYFxNHifOqkWIh', alquimista: '1yXVk_j96ktwJXiR2PBPF9tRemXtQw6oD',
    princesa: '1529WuBppcktksdLw7J69LyXbC20X6TpI', akatsuke: '1rp21G_iwumN0aoYcjjNs1H5e1g7siTOa',
};

function getImageUrl(avatarId) {
    const id = IMAGE_IDS[avatarId];
    if (!id || id === '1ABC123DEF456') return `https://via.placeholder.com/150x150?text=${avatarId}`;
    return `https://lh3.googleusercontent.com/d/${id}`;}
// ==================== PERSONAGENS ====================
const personagens = [
    { id: 'base', nome: 'Aventureiro', nivelMinimo: 1 },
    { id: 'soldado', nome: 'Soldado', nivelMinimo: 1 },
    { id: 'ninja', nome: 'Ninja', nivelMinimo: 2 },
    { id: 'bruxa', nome: 'Bruxa', nivelMinimo: 2 },
    { id: 'feiticeiro', nome: 'Feiticeiro', nivelMinimo: 3 },
    { id: 'alquimista', nome: 'Alquimista', nivelMinimo: 3 },
    { id: 'princesa', nome: 'Princesa', nivelMinimo: 4 },
    { id: 'akatsuke', nome: 'Akatsuki', nivelMinimo: 5 },
];

// ==================== TÍTULOS ====================
const availableTitles = [
    { id: 'initiate', name: 'Aprendiz', icon: '🌱', minLevel: 1 },
    { id: 'apprentice', name: 'Aprendiz Mágico', icon: '🔰', minLevel: 2 },
    { id: 'adept', name: 'Adepto Arcano', icon: '⚡', minLevel: 3 },
    { id: 'mage', name: 'Mago', icon: '🔮', minLevel: 5 },
    { id: 'archmage', name: 'Arquimago', icon: '✨', minLevel: 8 }
];

// ==================== MATÉRIAS ====================
const subjects = [
    { id: 1, name: 'Português', icon: '📚' },
    { id: 2, name: 'Matemática', icon: '🔢' },
    { id: 3, name: 'História', icon: '🏰' }
];

// ==================== ESTADO GLOBAL ====================
const state = {
    currentView: 'login', userType: null, user: null, selectedSubject: 1,
    selectedBimester: 1, selectedWeek: 1, selectedClass: '1ºB', selectedTaskId: null,
    selectedStudentRa: null, selectedMissionForAnswers: null,
    adminTab: 'subjects',
    
    currentMission: { title: '', subject: 1, class: '1ºB', bimester: 1, week: 1, xp: 0, questions: [] },
    subjects: subjects,
    availableTitles: availableTitles,
    availableClasses: ['1ºA', '1ºB', '2ºC', '3ºA'],
    bimesterStructure: { 1: { name: '1º Bimestre', weeks: 8 }, 2: { name: '2º Bimestre', weeks: 8 } },
    
    teachers: [
        { id: 1, name: 'Profª Sílvia Garcia', cpf: '123.456.789-00', email: 'silvia@escola.com', 
          password: '123456', subjects: [1, 2], classes: ['1ºB', '2ºC'] }
    ],
    
    tasks: [
        { id: 1, title: 'Equações de 2º Grau', subject: 2, teacherId: 1, class: '1ºB', bimester: 1, week: 3, xp: 150,
          questions: [{ q: 'Qual o valor de x em x² - 4 = 0?', options: ['2 e -2', '0', '4', '1'], correct: 0, difficulty: 'medium', type: 'multiple' }] },
        { id: 2, title: 'Interpretação de Texto', subject: 1, teacherId: 1, class: '1ºB', bimester: 1, week: 3, xp: 100,
          questions: [{ q: 'Qual é a ideia principal do texto?', options: ['A importância da leitura', 'Como escrever bem', 'História', 'Gramática'], correct: 0, difficulty: 'easy', type: 'multiple' }] }
    ],
    
    students: [
        { ra: '123', name: 'Laurie Vitória', level: 5, xp: 450, xpToNextLevel: 600, class: '1ºB', 
          avatarName: 'Maga da Lógica', title: 'mage', customTitle: '', password: '123',
          avatarId: 'base',
          tasksDone: [1], tasksPending: [2], answers: {},
          unlockedAvatars: ['base', 'soldado', 'ninja', 'bruxa', 'feiticeiro', 'alquimista', 'princesa', 'akatsuke'] },
        { ra: '1234', name: 'Carlos Eduardo', level: 2, xp: 150, xpToNextLevel: 400, class: '1ºB', 
          avatarName: 'Guerreiro do Saber', title: 'apprentice', customTitle: '', password: '1234',
          avatarId: 'ninja',
          tasksDone: [], tasksPending: [1, 2], answers: {},
          unlockedAvatars: ['base', 'soldado', 'ninja'] }
    ]
};

// ==================== FUNÇÕES AUXILIARES ====================
function getSubjectName(id) { const s = state.subjects.find(s => s.id === id); return s ? s.name : 'Desconhecida'; }
function getSubjectIcon(id) { const s = state.subjects.find(s => s.id === id); return s ? s.icon : '📚'; }
function getTasksByFilter(subjectId, className, bimester, week) { return state.tasks.filter(t => { if (subjectId && t.subject !== subjectId) return false; if (className && t.class !== className) return false; if (bimester && t.bimester !== bimester) return false; if (week && t.week !== week) return false; return true; }); }
function calculateXP(questions) { let total = 0; questions.forEach(q => { switch(q.difficulty) { case 'easy': total += 50; break; case 'medium': total += 100; break; case 'hard': total += 200; break; default: total += 50; } }); return total; }
function getFullTitle(student) { if (student.customTitle) return student.customTitle; const t = state.availableTitles.find(t => t.id === student.title); return t ? `${t.icon} ${t.name}` : '🌱 Aprendiz'; }
function clearCurrentMission() { state.currentMission = { title: '', subject: state.selectedSubject, class: state.selectedClass, bimester: state.selectedBimester, week: state.selectedWeek, xp: 0, questions: [] }; }
function navigate(view) { state.currentView = view; render(); }
function unlockAvatarsByLevel(student) {
    if (!student.unlockedAvatars) student.unlockedAvatars = ['base'];
    for (let p of personagens) {
        if (student.level >= p.nivelMinimo && !student.unlockedAvatars.includes(p.id)) {
            student.unlockedAvatars.push(p.id);
        }
    }
}
function selectAvatar(avatarId) {
    if (state.user && state.user.unlockedAvatars.includes(avatarId)) {
        state.user.avatarId = avatarId;
        render();
    }
}

// ==================== HANDLERS DE LOGIN ====================
function handleLogin() { 
    const id = document.getElementById('login_id')?.value, pass = document.getElementById('login_pass')?.value; 
    if (!id || !pass) { alert('Preencha todos os campos!'); return; } 
    if (state.userType === 'teacher') { 
        const t = state.teachers.find(t => t.cpf === id && t.password === pass); 
        if (t) { state.user = t; state.userType = 'teacher'; navigate('teacher_home'); } 
        else alert('Professor não encontrado!'); 
    } else if (state.userType === 'student') { 
        const s = state.students.find(s => s.ra === id && s.password === pass); 
        if (s) { state.user = s; state.userType = 'student'; unlockAvatarsByLevel(s); navigate('student_home'); } 
        else alert('Aluno não encontrado!'); 
    } 
}
function handleAdminLogin() { 
    const e = document.getElementById('admin_email')?.value, p = document.getElementById('admin_pass')?.value; 
    if (e === 'admin@magictask.com' && p === 'admin123') { state.userType = 'admin'; navigate('admin_dashboard'); } 
    else alert('Credenciais inválidas!'); 
}
function handleLogout() { state.user = null; state.userType = null; state.currentView = 'login'; render(); }

// ==================== HANDLERS ADMIN ====================
function addSubject() { 
    const n = document.getElementById('subject_name')?.value, i = document.getElementById('subject_icon')?.value || '📚'; 
    if (!n) { alert('Digite o nome da matéria!'); return; } 
    state.subjects.push({ id: state.subjects.length + 1, name: n, icon: i }); 
    alert(`✨ Matéria "${n}" cadastrada!`); 
    render(); 
}
function deleteSubject(id) { 
    if (confirm(`Excluir "${state.subjects.find(s => s.id === id)?.name}"?`)) { 
        state.tasks = state.tasks.filter(t => t.subject !== id); 
        state.subjects = state.subjects.filter(s => s.id !== id); 
        alert('Excluído!'); 
        render(); 
    } 
}
function addTeacher() { 
    const n = document.getElementById('teacher_name')?.value, cpf = document.getElementById('teacher_cpf')?.value, 
          e = document.getElementById('teacher_email')?.value, p = document.getElementById('teacher_password')?.value; 
    if (!n || !cpf || !e || !p) { alert('Preencha todos os campos!'); return; } 
    if (state.teachers.some(t => t.cpf === cpf)) { alert('CPF já existe!'); return; } 
    state.teachers.push({ id: state.teachers.length + 1, name: n, cpf, email: e, password: p, subjects: [1,2], classes: ['1ºB'] }); 
    alert(`Professor ${n} cadastrado!`); 
    render(); 
}
function deleteTeacher(id) { 
    if (confirm(`Excluir o professor?`)) { 
        state.teachers = state.teachers.filter(t => t.id !== id); 
        alert('Excluído!'); 
        render(); 
    } 
}
function addClass() { 
    const n = document.getElementById('new_class_name')?.value; 
    if (!n) { alert('Digite o nome da turma!'); return; } 
    state.availableClasses.push(n); 
    alert(`Turma "${n}" criada!`); 
    render(); 
}
function deleteClass(cn) { 
    if (confirm(`Excluir "${cn}"?`)) { 
        state.availableClasses = state.availableClasses.filter(c => c !== cn); 
        alert('Excluída!'); 
        render(); 
    } 
}
function addStudent() { 
    const ra = document.getElementById('student_ra')?.value, n = document.getElementById('student_name')?.value, 
          p = document.getElementById('student_password')?.value, cls = document.getElementById('student_class')?.value, 
          av = document.getElementById('student_avatar')?.value; 
    if (!ra || !n || !p || !cls || !av) { alert('Preencha todos os campos!'); return; } 
    if (state.students.some(s => s.ra === ra)) { alert('RA já existe!'); return; } 
    state.students.push({ ra, name: n, level: 1, xp: 0, xpToNextLevel: 100, class: cls, avatarName: av, avatarId: 'base',
                          title: 'initiate', customTitle: '', password: p, tasksDone: [], tasksPending: [], answers: {}, unlockedAvatars: ['base'] }); 
    alert(`Aluno ${n} matriculado!`); 
    render(); 
}
function deleteStudent(ra) { 
    if (confirm(`Excluir o aluno?`)) { 
        state.students = state.students.filter(s => s.ra !== ra); 
        alert('Excluído!'); 
        render(); 
    } 
}

// ==================== HANDLERS PROFESSOR ====================
function saveMissionAndContinue() { 
    const t = document.getElementById('mission_title')?.value, s = parseInt(document.getElementById('mission_subject')?.value), 
          c = document.getElementById('mission_class')?.value, b = parseInt(document.getElementById('mission_bimester')?.value), 
          w = parseInt(document.getElementById('mission_week')?.value); 
    if (!t) { alert('Digite o título!'); return; } 
    state.currentMission = { ...state.currentMission, title: t, subject: s, class: c, bimester: b, week: w }; 
    state.selectedSubject = s; state.selectedBimester = b; state.selectedWeek = w; 
    navigate('teacher_create_questions'); 
}
function addQuestion() { 
    const qt = document.getElementById('question_text')?.value, type = document.getElementById('question_type')?.value,
          opts = [document.getElementById('option_0')?.value, document.getElementById('option_1')?.value, 
                   document.getElementById('option_2')?.value, document.getElementById('option_3')?.value], 
          ca = parseInt(document.querySelector('input[name="correct_answer"]:checked')?.value || 0), 
          d = document.getElementById('question_difficulty')?.value; 
    if (!qt || opts.some(o => !o)) { alert('Preencha pergunta e alternativas!'); return; } 
    state.currentMission.questions.push({ q: qt, options: opts, correct: ca, difficulty: d, type: type, image: '' }); 
    state.currentMission.xp = calculateXP(state.currentMission.questions); 
    document.getElementById('question_text').value = ''; 
    ['option_0', 'option_1', 'option_2', 'option_3'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; }); 
    render(); 
}
function removeQuestion(i) { state.currentMission.questions.splice(i, 1); state.currentMission.xp = calculateXP(state.currentMission.questions); render(); }
function finishMission() { 
    if (state.currentMission.questions.length === 0) { alert('Adicione pelo menos uma pergunta!'); return; } 
    const newTask = { id: state.tasks.length + 1, title: state.currentMission.title, subject: state.currentMission.subject, 
                      class: state.currentMission.class, bimester: state.currentMission.bimester, week: state.currentMission.week, 
                      xp: state.currentMission.xp, questions: [...state.currentMission.questions], teacherId: state.user?.id || 1 }; 
    state.tasks.push(newTask); 
    alert(`Missão "${newTask.title}" criada!`); 
    clearCurrentMission(); 
    navigate('teacher_week'); 
}
function saveMissionDirectly() { 
    const t = document.getElementById('mission_title')?.value; 
    if (!t) { alert('Digite o título!'); return; } 
    if (confirm('Salvar sem perguntas?')) { 
        const s = parseInt(document.getElementById('mission_subject')?.value), c = document.getElementById('mission_class')?.value, 
              b = parseInt(document.getElementById('mission_bimester')?.value), w = parseInt(document.getElementById('mission_week')?.value); 
        state.tasks.push({ id: state.tasks.length + 1, title: t, subject: s, class: c, bimester: b, week: w, xp: 0, 
                          questions: [], teacherId: state.user?.id || 1 }); 
        alert('Missão salva!'); 
        clearCurrentMission(); 
        navigate('teacher_week'); 
    } 
}
function submitTask(taskId) { 
    const task = state.tasks.find(t => t.id === taskId); 
    if (!task) return; 
    let correct = 0; const answers = {}; 
    task.questions.forEach((q, i) => { 
        const selected = document.querySelector(`input[name="q_${i}"]:checked`); 
        const answerValue = selected ? parseInt(selected.value) : -1; 
        answers[i] = answerValue; 
        if (selected && parseInt(selected.value) === q.correct) correct++; 
    }); 
    const earned = Math.round((correct / task.questions.length) * task.xp); 
    const student = state.user; 
    if (student) { 
        if (!student.answers) student.answers = {}; 
        student.answers[taskId] = answers; 
        student.xp += earned; 
        while (student.xp >= student.xpToNextLevel) { 
            student.xp -= student.xpToNextLevel; 
            student.level++; 
            student.xpToNextLevel = Math.round(student.xpToNextLevel * 1.5); 
            unlockAvatarsByLevel(student);
        } 
        if (student.tasksPending) student.tasksPending = student.tasksPending.filter(id => id !== taskId); 
        if (!student.tasksDone.includes(taskId)) student.tasksDone.push(taskId); 
    } 
    alert(`Missão concluída! +${earned} XP`); 
    navigate('student_home'); 
}
function saveStudentProfile() { 
    const s = state.user; if (!s) return; 
    const newAvatar = document.getElementById('profile_avatar_name')?.value, newTitle = document.getElementById('profile_title')?.value, newCustom = document.getElementById('profile_custom_title')?.value; 
    if (newAvatar && newAvatar.trim()) s.avatarName = newAvatar.trim(); 
    if (newTitle === 'custom') { if (newCustom && newCustom.trim()) { s.customTitle = newCustom.trim(); s.title = 'custom'; } } 
    else { s.title = newTitle; s.customTitle = ''; } 
    alert('Perfil atualizado!'); 
    navigate('student_profile'); 
}
function viewStudentAnswers(studentRa, taskId) { state.selectedStudentRa = studentRa; state.selectedMissionForAnswers = taskId; navigate('teacher_student_answers'); }
function getClassStats(className) {
    const students = state.students.filter(s => s.class === className);
    let totalXP = 0, totalDone = 0, totalPending = 0, levelDist = {};
    students.forEach(s => { totalXP += s.xp; totalDone += s.tasksDone.length; totalPending += s.tasksPending.length; levelDist[s.level] = (levelDist[s.level] || 0) + 1; });
    return { totalStudents: students.length, avgCompletion: totalDone+totalPending > 0 ? (totalDone/(totalDone+totalPending))*100 : 0, avgXP: students.length ? totalXP/students.length : 0, levelDistribution: levelDist };
}

// ============= RENDER ADMIN =============
function renderAdminDashboard() { 
    return `<div class="min-h-screen"><header class="magic-bg text-white p-6"><div class="flex justify-between"><div><h1 class="text-3xl font-bold">✨ Painel Admin ✨</h1><p class="text-purple-200">Gerencie matérias, professores, turmas e alunos</p></div><button onclick="handleLogout()" class="bg-red-500 px-4 py-2 rounded-lg">Sair</button></div></header><div class="p-6"><div class="flex gap-3 mb-6"><button onclick="state.adminTab='subjects'; render()" class="px-4 py-2 rounded-lg font-bold ${state.adminTab === 'subjects' ? 'magic-bg text-white' : 'bg-white'}">📚 Matérias</button><button onclick="state.adminTab='teachers'; render()" class="px-4 py-2 rounded-lg font-bold ${state.adminTab === 'teachers' ? 'magic-bg text-white' : 'bg-white'}">👨‍🏫 Professores</button><button onclick="state.adminTab='classes'; render()" class="px-4 py-2 rounded-lg font-bold ${state.adminTab === 'classes' ? 'magic-bg text-white' : 'bg-white'}">🏫 Turmas</button><button onclick="state.adminTab='students'; render()" class="px-4 py-2 rounded-lg font-bold ${state.adminTab === 'students' ? 'magic-bg text-white' : 'bg-white'}">🎒 Alunos</button></div><div class="grid grid-cols-4 gap-4 mb-6"><div class="bg-white p-4 rounded-xl text-center"><p class="text-2xl font-bold text-purple-600">${state.subjects.length}</p><p class="text-xs">Matérias</p></div><div class="bg-white p-4 rounded-xl text-center"><p class="text-2xl font-bold text-pink-600">${state.teachers.length}</p><p class="text-xs">Professores</p></div><div class="bg-white p-4 rounded-xl text-center"><p class="text-2xl font-bold text-indigo-600">${state.availableClasses.length}</p><p class="text-xs">Turmas</p></div><div class="bg-white p-4 rounded-xl text-center"><p class="text-2xl font-bold text-green-600">${state.students.length}</p><p class="text-xs">Alunos</p></div></div>
    ${state.adminTab === 'subjects' ? `<div class="bg-white rounded-xl p-6"><h2 class="font-bold mb-4">➕ Adicionar Matéria</h2><input type="text" id="subject_name" placeholder="Nome" class="w-full p-2 border rounded-lg mb-2"><button onclick="addSubject()" class="btn-magic text-white px-4 py-2 rounded-lg">Cadastrar</button><h2 class="font-bold mt-6 mb-4">📋 Matérias</h2>${state.subjects.map(s => `<div class="flex justify-between p-2 border-b"><span>${s.icon} ${s.name}</span><button onclick="deleteSubject(${s.id})" class="text-red-500">🗑️</button></div>`).join('')}</div>` :
    state.adminTab === 'teachers' ? `<div class="bg-white rounded-xl p-6"><h2 class="font-bold mb-4">➕ Cadastrar Professor</h2><div class="grid grid-cols-2 gap-2"><input type="text" id="teacher_name" placeholder="Nome" class="p-2 border rounded-lg"><input type="text" id="teacher_cpf" placeholder="CPF" class="p-2 border rounded-lg"></div><div class="grid grid-cols-2 gap-2 mt-2"><input type="email" id="teacher_email" placeholder="E-mail" class="p-2 border rounded-lg"><input type="text" id="teacher_password" placeholder="Senha" class="p-2 border rounded-lg"></div><button onclick="addTeacher()" class="btn-magic text-white px-4 py-2 rounded-lg mt-2">Cadastrar</button><h2 class="font-bold mt-6 mb-4">👨‍🏫 Professores</h2>${state.teachers.map(t => `<div class="flex justify-between p-2 border-b"><span>${t.name}</span><button onclick="deleteTeacher(${t.id})" class="text-red-500">🗑️</button></div>`).join('')}</div>` :
    state.adminTab === 'classes' ? `<div class="bg-white rounded-xl p-6"><h2 class="font-bold mb-4">➕ Criar Turma</h2><input type="text" id="new_class_name" placeholder="Ex: 5ºA" class="w-full p-2 border rounded-lg mb-2"><button onclick="addClass()" class="btn-magic text-white px-4 py-2 rounded-lg">Criar</button><h2 class="font-bold mt-6 mb-4">🏫 Turmas</h2>${state.availableClasses.map(c => `<div class="flex justify-between p-2 border-b"><span>${c}</span><button onclick="deleteClass('${c}')" class="text-red-500">🗑️</button></div>`).join('')}</div>` :

function renderDoTask() { 
    const t = state.tasks.find(t => t.id === state.selectedTaskId); 
    if (!t) return '<p>Missão não encontrada</p>'; 
    return `<div class="min-h-screen pb-20"><header class="bg-white/95 p-4"><button onclick="navigate('student_tasks')" class="mb-2 text-purple-600">← Voltar</button><h1 class="text-2xl font-bold">✨ ${t.title}</h1><span class="xp-badge text-white px-3 py-1 rounded-full text-sm">+${t.xp} XP</span></header><div class="p-4"><form onsubmit="event.preventDefault(); submitTask(${t.id})">${t.questions.map((q, i) => `<div class="bg-white/90 p-6 rounded-xl shadow-lg mb-4"><h3 class="font-bold mb-3">Questão ${i+1}</h3><p class="mb-4">${q.q}</p>${q.options.map((opt, oi) => `<label class="flex items-center p-3 border rounded-lg cursor-pointer mb-2"><input type="radio" name="q_${i}" value="${oi}" class="mr-3">${opt}</label>`).join('')}</div>`).join('')}<button type="submit" class="w-full bg-green-500 text-white py-4 rounded-xl font-bold">✨ ENTREGAR ✨</button></form></div></div>`; 
}
function renderStudentProfile() { 
    const s = state.user || state.students[0]; 
    const progress = Math.min((s.xp / s.xpToNextLevel) * 100, 100); 
    const available = state.availableTitles.filter(t => t.minLevel <= s.level); 
    const titleDisplay = getFullTitle(s); 
    return `<div class="min-h-screen pb-20"><header class="magic-bg text-white p-6"><div class="flex justify-between"><h1 class="text-2xl font-bold">👤 Meu Perfil</h1><button onclick="handleLogout()" class="bg-red-500 px-4 py-2 rounded-lg">SAIR</button></div><div class="flex items-center gap-4 mt-4"><div class="w-20 h-20 bg-white rounded-full p-1 overflow-hidden"><img src="${getImageUrl(s.avatarId)}" class="w-full h-full object-cover rounded-full"></div><div><h2 class="text-xl font-bold">${s.avatarName}</h2><p class="text-purple-200">${s.name}</p><div><span class="bg-white/20 px-2 py-0.5 rounded-full text-xs">Nível ${s.level}</span><span class="bg-white/20 px-2 py-0.5 rounded-full text-xs ml-2 animate-title-glow">${titleDisplay}</span></div></div></div></header><div class="p-4 space-y-4"><div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">📋 Informações</h3><div class="space-y-2 text-sm"><div class="flex justify-between"><span>Nome:</span><span class="font-bold">${s.name}</span></div><div class="flex justify-between"><span>RA:</span><span class="font-bold">${s.ra}</span></div><div class="flex justify-between"><span>Turma:</span><span class="font-bold">${s.class}</span></div></div></div><div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">⭐ Progresso</h3><div class="flex justify-between text-sm mb-2"><span>${s.xp} / ${s.xpToNextLevel} XP</span><span>${progress.toFixed(0)}%</span></div><div class="w-full bg-purple-200 rounded-full h-3"><div class="magic-bg h-3 rounded-full" style="width: ${progress}%"></div></div></div><div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">✨ Personalização</h3><div class="space-y-4"><div><label class="block text-sm font-bold mb-2">🎭 Nome do Avatar</label><input type="text" id="profile_avatar_name" value="${s.avatarName}" class="w-full p-3 border rounded-lg"></div><div><label class="block text-sm font-bold mb-2">🏆 Título</label><select id="profile_title" class="w-full p-3 border rounded-lg"><option value="">Selecione</option>${available.map(t => `<option value="${t.id}" ${s.title === t.id && !s.customTitle ? 'selected' : ''}>${t.icon} ${t.name}</option>`).join('')}<option value="custom" ${s.title === 'custom' ? 'selected' : ''}>✨ Personalizado</option></select></div><div id="custom_title_container" style="${s.title === 'custom' ? 'display:block' : 'display:none'}"><label class="block text-sm font-bold mb-2">✏️ Título Personalizado</label><input type="text" id="profile_custom_title" value="${s.customTitle || ''}" placeholder="Ex: Guardião das Estrelas" class="w-full p-3 border rounded-lg"></div><button onclick="saveStudentProfile()" class="btn-magic text-white px-6 py-3 rounded-lg font-bold w-full">💾 SALVAR</button></div></div></div><nav class="fixed bottom-0 w-full bg-white/95 border-t flex justify-around py-3"><button onclick="navigate('student_home')" class="text-gray-400">🏠</button><button onclick="navigate('student_tasks')" class="text-gray-400">📋</button><button onclick="navigate('student_avatars')" class="text-gray-400">⭐</button><button onclick="navigate('student_profile')" class="text-purple-600">👤</button></nav></div>`; 
}
function renderStudentAvatars() { 
    const s = state.user; if (!s) return ''; 
    return `<div class="min-h-screen pb-20"><header class="bg-white/95 p-4 flex justify-between"><button onclick="navigate('student_home')" class="text-purple-600">← Voltar</button><h1 class="text-xl font-bold">✨ Escolha seu Avatar</h1><div></div></header><div class="p-6"><div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-3xl p-8 mb-8"><div class="main-avatar animate-float"><img src="${getImageUrl(s.avatarId)}"></div><div class="text-center mt-6"><h2 class="text-3xl font-bold text-purple-800">${personagens.find(p => p.id === s.avatarId)?.nome}</h2></div></div><h3 class="font-bold mb-4">Personagens (${s.unlockedAvatars?.length || 1}/${personagens.length})</h3><div class="avatar-grid">${personagens.map(p => { const unlocked = s.unlockedAvatars?.includes(p.id); const isSelected = s.avatarId === p.id; return `<div onclick="${unlocked ? `selectAvatar('${p.id}')` : ''}" class="avatar-card bg-white rounded-xl p-3 text-center ${!unlocked ? 'locked-item' : ''} ${isSelected ? 'selected-avatar' : ''}"><div class="avatar-thumb"><img src="${getImageUrl(p.id)}"></div><div class="font-bold text-purple-700 text-sm mt-2">${p.nome}</div>${!unlocked ? `<div class="text-xs text-gray-500">🔒 Nível ${p.nivelMinimo}</div>` : ''}${isSelected ? `<div class="text-xs text-purple-600">✅ ATUAL</div>` : ''}</div>`; }).join('')}</div></div><nav class="fixed bottom-0 w-full bg-white/95 border-t flex justify-around py-3"><button onclick="navigate('student_home')" class="text-gray-400">🏠</button><button onclick="navigate('student_tasks')" class="text-gray-400">📋</button><button onclick="navigate('student_avatars')" class="text-purple-600">⭐</button><button onclick="navigate('student_profile')" class="text-gray-400">👤</button></nav></div>`; 
}
function renderLogin() {  
    return `<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100">
        <div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-2xl w-full max-w-md animate-magic-glow">
            <div class="text-center mb-8">
                <!-- LOGO DO NEGÓCIO -->
                <img src="https://lh3.googleusercontent.com/d/1-iyRy4OuYodo-cgar_ZQcdsw2cv7p7UA" class="w-40 h-40 mx-auto mb-4 animate-float rounded-2xl shadow-lg">
                <!-- FIM DA LOGO -->
                <h1 class="text-4xl font-bold magic-bg bg-clip-text text-transparent mb-2">MagicTask</h1>
                <p class="text-gray-600">A aventura do conhecimento!</p>
            </div>
            <div class="flex mb-6 space-x-2">
                <button onclick="state.userType='student'; render()" class="flex-1 py-3 rounded-lg font-bold transition-all ${state.userType === 'student' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg' : 'bg-gray-100 text-gray-600'}">🎒 Aluno</button>
                <button onclick="state.userType='teacher'; render()" class="flex-1 py-3 rounded-lg font-bold transition-all ${state.userType === 'teacher' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg' : 'bg-gray-100 text-gray-600'}">👨‍🏫 Professor</button>
            </div>
            <div class="space-y-4">
                <input type="text" id="login_id" placeholder="${state.userType === 'teacher' ? 'CPF' : 'RA'}" class="w-full p-3 border-2 border-purple-200 rounded-lg">
                <input type="password" id="login_pass" placeholder="Senha" class="w-full p-3 border-2 border-purple-200 rounded-lg">
                <button onclick="handleLogin()" class="w-full magic-bg text-white py-4 rounded-lg font-bold text-lg">✨ ENTRAR ✨</button>
            </div>
            <div class="mt-6 p-4 bg-purple-50 rounded-lg text-sm">
                <p class="font-bold">🔮 Credenciais:</p>
                <p>👩‍🎓 Aluno: RA 123 | Senha 123</p>
                <p>👨‍🏫 Professor: CPF 123.456.789-00 | Senha 123456</p>
                <div class="mt-2 pt-2 border-t border-purple-200">
                    <a href="#" onclick="navigate('admin_login')" class="text-purple-600 hover:text-purple-800">🔧 Área Administrativa</a>
                </div>
            </div>
        </div>
    </div>`; 

}
function renderAdminLogin() { 
    return `<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-2xl w-full max-w-md"><h1 class="text-2xl font-bold text-center mb-6 magic-bg bg-clip-text text-transparent">Admin MagicTask</h1><div class="space-y-4"><input type="email" id="admin_email" placeholder="E-mail" class="w-full p-3 border rounded-lg"><input type="password" id="admin_pass" placeholder="Senha" class="w-full p-3 border rounded-lg"><button onclick="handleAdminLogin()" class="w-full magic-bg text-white py-3 rounded-lg font-bold">ENTRAR</button></div><button onclick="navigate('login')" class="mt-4 text-gray-500">← Voltar</button></div></div>`; 
}
function render() { 
    const app = document.getElementById('app'); 
    if (!app) return; 
    const views = { login: renderLogin, admin_login: renderAdminLogin, admin_dashboard: renderAdminDashboard, 
                    teacher_home: renderTeacherHome, teacher_subject: renderTeacherSubject, teacher_bimester: renderTeacherBimester, 
                    teacher_week: renderTeacherWeek, teacher_create_task: renderCreateTask, teacher_create_questions: renderCreateQuestions, 
                    teacher_task_detail: renderTaskDetail, teacher_class_detail: renderTeacherClassDetail, teacher_student_detail: renderTeacherStudentDetail, 
                    teacher_student_answers: renderTeacherStudentAnswers, student_home: renderStudentHome, student_tasks: renderStudentTasks, 
                    student_do_task: renderDoTask, student_profile: renderStudentProfile, student_avatars: renderStudentAvatars }; 
    app.innerHTML = views[state.currentView] ? views[state.currentView]() : renderLogin(); 
    const titleSelect = document.getElementById('profile_title'); if (titleSelect) titleSelect.onchange = function() { const ct = document.getElementById('custom_title_container'); if (ct) ct.style.display = this.value === 'custom' ? 'block' : 'none'; }; 
}

window.state = state; window.navigate = navigate; window.handleLogin = handleLogin; window.handleAdminLogin = handleAdminLogin; window.handleLogout = handleLogout;
window.saveMissionAndContinue = saveMissionAndContinue; window.addQuestion = addQuestion; window.removeQuestion = removeQuestion; window.finishMission = finishMission;
window.saveMissionDirectly = saveMissionDirectly; window.submitTask = submitTask; window.saveStudentProfile = saveStudentProfile;
window.addSubject = addSubject; window.deleteSubject = deleteSubject; window.addTeacher = addTeacher; window.deleteTeacher = deleteTeacher;
window.addClass = addClass; window.deleteClass = deleteClass; window.addStudent = addStudent; window.deleteStudent = deleteStudent;
window.viewStudentAnswers = viewStudentAnswers; window.selectAvatar = selectAvatar;

render();
console.log('✨ MagicTask - Avatar agora é uma ABA separada! ✨');
</script>
