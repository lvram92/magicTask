<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduQuest - Sistema Educacional Gamificado</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes float {
0%, 100% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
}
@keyframes magicGlow {
0% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); }
50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.8); }
100% { box-shadow: 0 0 5px rgba(139, 92, 246, 0.5); }
}
@keyframes titleGlow {
0%, 100% { text-shadow: 0 0 5px rgba(139, 92, 246, 0.5); }
50% { text-shadow: 0 0 20px rgba(139, 92, 246, 0.8); }
}
.animate-float { animation: float 3s ease-in-out infinite; }
.animate-magic-glow { animation: magicGlow 2s ease-in-out infinite; }
.animate-title-glow { animation: titleGlow 2s ease-in-out infinite; }
.xp-badge { background: linear-gradient(135deg, #8B5CF6 0%, #C084FC 50%, #E879F9 100%); }
.magic-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%); }
.btn-magic { background: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%); transition: all 0.3s ease; }
.btn-magic:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5); }
.correct-answer { background-color: #dcfce7; border-left: 4px solid #22c55e; }
.wrong-answer { background-color: #fee2e2; border-left: 4px solid #ef4444; }
</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50">
<div id="app"></div>
<script>
const state = {
    currentView: 'login', userType: null, user: null, selectedSubject: 1,
    selectedBimester: 1, selectedWeek: 1, selectedClass: '1ºB', selectedTaskId: null,
    selectedStudentRa: null, selectedMissionForAnswers: null,
    activeCustomizationTab: 'hair', adminTab: 'subjects',
    currentMission: { title: '', subject: 1, class: '1ºB', bimester: 1, week: 1, xp: 0, questions: [] },
    hairStyles: [{ id: 'short', name: 'Curto', icon: '💇' }, { id: 'long', name: 'Longo', icon: '💇‍♀️' }, { id: 'curly', name: 'Cacheado', icon: '👩‍🦱' }, { id: 'spiky', name: 'Espetado', icon: '💥' }, { id: 'mohawk', name: 'Moicano', icon: '🎸' }, { id: 'bun', name: 'Coque', icon: '🍩' }],
    hairColors: ['#4A3728', '#FFD700', '#FF6347', '#8B4513', '#C0C0C0', '#FF69B4', '#00CED1', '#9400D3'],
    outfitStyles: [{ id: 'basic', name: 'Básico', icon: '👕' }, { id: 'armor', name: 'Armadura', icon: '🛡️' }, { id: 'robe', name: 'Manto', icon: '🧙' }, { id: 'sporty', name: 'Esportivo', icon: '🏃' }],
    outfitColors: ['#8B5CF6', '#C084FC', '#E879F9', '#FBBF24', '#34D399', '#60A5FA', '#F472B6', '#A78BFA'],
    accessories: [{ id: 'none', name: 'Nenhum', icon: '🚫' }, { id: 'sword', name: 'Espada Mágica', icon: '⚔️' }, { id: 'staff', name: 'Cajado Arcano', icon: '🪄' }, { id: 'shield', name: 'Escudo Protetor', icon: '🛡️' }, { id: 'book', name: 'Grimório', icon: '📖' }, { id: 'wand', name: 'Varinha Estelar', icon: '✨' }],
    availableTitles: [{ id: 'initiate', name: 'Aprendiz', icon: '🌱', minLevel: 1 }, { id: 'apprentice', name: 'Aprendiz Mágico', icon: '🔰', minLevel: 2 }, { id: 'adept', name: 'Adepto Arcano', icon: '⚡', minLevel: 3 }, { id: 'mage', name: 'Mago', icon: '🔮', minLevel: 5 }, { id: 'archmage', name: 'Arquimago', icon: '✨', minLevel: 8 }, { id: 'sage', name: 'Sábio', icon: '📜', minLevel: 10 }, { id: 'legend', name: 'Lenda Viva', icon: '🌟', minLevel: 15 }, { id: 'mythic', name: 'Mítico', icon: '🏆', minLevel: 20 }],
    subjects: [{ id: 1, name: 'Português Mágico', icon: '📚' }, { id: 2, name: 'Matemática Encantada', icon: '🔢' }, { id: 3, name: 'História Mística', icon: '🏰' }, { id: 4, name: 'Geografia Astral', icon: '🌍' }, { id: 5, name: 'Ciências Alquímicas', icon: '🧪' }, { id: 6, name: 'Inglês Élfico', icon: '🗣️' }],
    teachers: [{ id: 1, name: 'Profª Sílvia Garcia', cpf: '123.456.789-00', email: 'silvia@escola.com', password: '123456', subjects: [1, 2], classes: ['1ºB', '2ºC'] }],
    availableClasses: ['1ºA', '1ºB', '2ºC', '3ºA', '3ºB', '4ºC'],
    bimesterStructure: { 1: { name: '1º Bimestre Mágico', weeks: 8 }, 2: { name: '2º Bimestre Arcano', weeks: 8 }, 3: { name: '3º Bimestre Encantado', weeks: 8 }, 4: { name: '4º Bimestre Lendário', weeks: 8 } },
    tasks: [{ id: 1, title: 'Equações de 2º Grau', subject: 2, teacherId: 1, class: '1ºB', bimester: 1, week: 3, xp: 150, questions: [{ q: 'Qual o valor de x em x² - 4 = 0?', options: ['2 e -2', '0', '4', '1'], correct: 0, difficulty: 'medium' }, { q: 'Resolva: 3x² - 27 = 0', options: ['x = ±3', 'x = 9', 'x = 0', 'x = 27'], correct: 0, difficulty: 'medium' }] },
    { id: 2, title: 'Interpretação de Texto', subject: 1, teacherId: 1, class: '1ºB', bimester: 1, week: 3, xp: 100, questions: [{ q: 'Qual é a ideia principal do texto?', options: ['A importância da leitura', 'Como escrever bem', 'História do Brasil', 'Gramática'], correct: 0, difficulty: 'easy' }] },
    { id: 3, title: 'Revolução Francesa', subject: 3, teacherId: 1, class: '1ºB', bimester: 2, week: 1, xp: 200, questions: [{ q: 'Em que ano ocorreu a Revolução Francesa?', options: ['1789', '1776', '1804', '1815'], correct: 0, difficulty: 'medium' }] },
    { id: 4, title: 'Clima e Tempo', subject: 4, teacherId: 1, class: '1ºB', bimester: 1, week: 5, xp: 120, questions: [{ q: 'Qual a diferença entre clima e tempo?', options: ['Clima é longo prazo, tempo é curto prazo', 'São a mesma coisa', 'Tempo é só chuva', 'Clima é só temperatura'], correct: 0, difficulty: 'easy' }] },
    { id: 5, title: 'Células e Organismos', subject: 5, teacherId: 1, class: '1ºB', bimester: 2, week: 3, xp: 180, questions: [{ q: 'Qual organela é responsável pela respiração celular?', options: ['Mitocôndria', 'Núcleo', 'Ribossomo', 'Cloroplasto'], correct: 0, difficulty: 'hard' }] },
    { id: 6, title: 'Verbos em Inglês', subject: 6, teacherId: 1, class: '1ºB', bimester: 1, week: 7, xp: 130, questions: [{ q: 'Qual é o passado de "go"?', options: ['Went', 'Goed', 'Goes', 'Going'], correct: 0, difficulty: 'medium' }] }],
    students: [{ ra: '123', name: 'Laurie Vitória', level: 5, xp: 450, xpToNextLevel: 600, class: '1ºB', avatarName: 'Maga da Lógica', title: 'mage', customTitle: '', password: '123', charData: { gender: 'female', hairStyle: 'long', hairColor: '#C084FC', skinTone: '#FFD93D', outfitStyle: 'robe', outfitColor: '#8B5CF6', accessory: 'staff' }, tasksDone: [1], tasksPending: [2, 3, 4, 5, 6], achievements: [{ id: 1, name: 'Primeira Missão', icon: '🌟' }], answers: {} },
    { ra: '1234', name: 'Carlos Eduardo', level: 3, xp: 250, xpToNextLevel: 400, class: '1ºB', avatarName: 'Guerreiro do Saber', title: 'apprentice', customTitle: '', password: '1234', charData: { gender: 'male', hairStyle: 'spiky', hairColor: '#FBBF24', skinTone: '#F5C6A0', outfitStyle: 'armor', outfitColor: '#E879F9', accessory: 'sword' }, tasksDone: [], tasksPending: [1, 2, 3, 4, 5, 6], achievements: [], answers: {} }]
};

function getSubjectName(id) { const s = state.subjects.find(s => s.id === id); return s ? s.name : 'Desconhecida'; }
function getSubjectIcon(id) { const s = state.subjects.find(s => s.id === id); return s ? s.icon : '📚'; }
function getTasksByFilter(subjectId, className, bimester, week) { return state.tasks.filter(t => { if (subjectId && t.subject !== subjectId) return false; if (className && t.class !== className) return false; if (bimester && t.bimester !== bimester) return false; if (week && t.week !== week) return false; return true; }); }
function calculateXP(questions) { let total = 0; questions.forEach(q => { switch(q.difficulty) { case 'easy': total += 50; break; case 'medium': total += 100; break; case 'hard': total += 200; break; default: total += 50; } }); return total; }
function getFullTitle(student) { if (student.customTitle) return student.customTitle; const t = state.availableTitles.find(t => t.id === student.title); return t ? `${t.icon} ${t.name}` : '🌱 Aprendiz'; }
function getCharSVG(c = {}) { const oc = c.outfitColor || '#8B5CF6', acc = c.accessory || 'none'; return `<svg viewBox="0 0 100 100" width="64" height="64"><circle cx="50" cy="35" r="18" fill="#FFD93D"/><rect x="35" y="55" width="30" height="35" rx="5" fill="${oc}"/><rect x="30" y="55" width="10" height="25" rx="3" fill="${oc}"/><rect x="60" y="55" width="10" height="25" rx="3" fill="${oc}"/><circle cx="44" cy="33" r="3" fill="#333"/><circle cx="56" cy="33" r="3" fill="#333"/><path d="M 44 42 Q 50 48 56 42" stroke="#333" stroke-width="2" fill="none"/>${acc === 'sword' ? '<rect x="75" y="45" width="5" height="30" fill="#C0C0C0"/>' : ''}${acc === 'staff' ? '<rect x="78" y="30" width="4" height="45" fill="#8B4513"/><circle cx="80" cy="28" r="6" fill="#9B59B6"/>' : ''}</svg>`; }
function getDetailedCharSVG(c = {}, size = 200) { const hs = c.hairStyle || 'short', hc = c.hairColor || '#8B5CF6', st = c.skinTone || '#FFD93D', os = c.outfitStyle || 'basic', oc = c.outfitColor || '#8B5CF6', acc = c.accessory || 'none'; let op = '', hp = '', ap = ''; switch(os) { case 'armor': op = `<rect x="60" y="90" width="80" height="80" rx="8" fill="${oc}" stroke="#C084FC" stroke-width="3"/><rect x="65" y="95" width="70" height="8" fill="#E879F9"/>`; break; case 'robe': op = `<path d="M 55 90 L 145 90 L 155 175 L 45 175 Z" fill="${oc}" stroke="#C084FC" stroke-width="3"/>`; break; default: op = `<rect x="65" y="95" width="70" height="75" rx="5" fill="${oc}" stroke="#C084FC" stroke-width="2"/>`; } switch(hs) { case 'long': hp = `<path d="M 65 55 Q 100 30 135 55 L 140 120 L 130 120 L 120 60 Q 100 35 80 60 L 70 120 L 60 120 Z" fill="${hc}"/>`; break; case 'spiky': hp = `<polygon points="70,60 80,20 90,55" fill="${hc}"/><polygon points="90,55 100,15 110,55" fill="${hc}"/><polygon points="110,55 120,20 130,60" fill="${hc}"/>`; break; case 'curly': hp = `<circle cx="75" cy="45" r="15" fill="${hc}"/><circle cx="100" cy="40" r="18" fill="${hc}"/><circle cx="125" cy="45" r="15" fill="${hc}"/>`; break; case 'mohawk': hp = `<rect x="85" y="25" width="30" height="35" fill="${hc}"/>`; break; case 'bun': hp = `<circle cx="100" cy="35" r="20" fill="${hc}"/>`; break; default: hp = `<path d="M 65 55 Q 100 30 135 55" fill="${hc}"/>`; } switch(acc) { case 'sword': ap = `<rect x="150" y="80" width="8" height="60" fill="#E879F9" stroke="#8B5CF6" stroke-width="1"/><rect x="145" y="75" width="18" height="10" fill="#C084FC"/>`; break; case 'staff': ap = `<rect x="152" y="60" width="6" height="80" fill="#8B4513"/><circle cx="155" cy="55" r="12" fill="#E879F9"/><circle cx="155" cy="55" r="6" fill="#FBBF24"/>`; break; case 'shield': ap = `<ellipse cx="40" cy="115" rx="18" ry="22" fill="#C084FC" stroke="#8B5CF6" stroke-width="2"/>`; break; case 'book': ap = `<rect x="35" y="110" width="22" height="16" fill="#8B4513"/><rect x="38" y="113" width="16" height="10" fill="#FEF3C7"/>`; break; case 'wand': ap = `<line x1="40" y1="150" x2="55" y2="100" stroke="#8B4513" stroke-width="5"/><circle cx="55" cy="100" r="5" fill="#FBBF24"/>`; break; } return `<svg viewBox="0 0 200 200" width="${size}" height="${size}">${op}<rect x="35" y="100" width="35" height="22" rx="3" fill="${oc}" stroke="#C084FC" stroke-width="2"/><rect x="130" y="100" width="35" height="22" rx="3" fill="${oc}" stroke="#C084FC" stroke-width="2"/><rect x="75" y="165" width="22" height="30" fill="#4A3728"/><rect x="103" y="165" width="22" height="30" fill="#4A3728"/><circle cx="100" cy="70" r="35" fill="${st}" stroke="#333" stroke-width="2"/><circle cx="88" cy="65" r="4" fill="#333"/><circle cx="112" cy="65" r="4" fill="#333"/><circle cx="89" cy="64" r="1.5" fill="white"/><circle cx="113" cy="64" r="1.5" fill="white"/><path d="M 90 80 Q 100 90 110 80" stroke="#333" stroke-width="2" fill="none"/>${hp}${ap}</svg>`; }
function clearCurrentMission() { state.currentMission = { title: '', subject: state.selectedSubject, class: state.selectedClass, bimester: state.selectedBimester, week: state.selectedWeek, xp: 0, questions: [] }; }
function navigate(view) { state.currentView = view; render(); }

function handleLogin() { const id = document.getElementById('login_id')?.value, pass = document.getElementById('login_pass')?.value; if (!id || !pass) { alert('Preencha todos os campos!'); return; } if (state.userType === 'teacher') { const t = state.teachers.find(t => t.cpf === id && t.password === pass); if (t) { state.user = t; state.userType = 'teacher'; navigate('teacher_home'); } else alert('Professor não encontrado!'); } else if (state.userType === 'student') { const s = state.students.find(s => s.ra === id && s.password === pass); if (s) { state.user = s; state.userType = 'student'; navigate('student_home'); } else alert('Aluno não encontrado!'); } }
function handleAdminLogin() { const e = document.getElementById('admin_email')?.value, p = document.getElementById('admin_pass')?.value; if (e === 'admin@eduquest.com' && p === 'admin123') { state.userType = 'admin'; navigate('admin_dashboard'); } else alert('Credenciais inválidas!'); }
function handleLogout() { state.user = null; state.userType = null; state.currentView = 'login'; render(); }

// ADMIN FUNCTIONS
function addSubject() { const n = document.getElementById('subject_name')?.value, i = document.getElementById('subject_icon')?.value || '📚'; if (!n) { alert('Digite o nome da matéria!'); return; } state.subjects.push({ id: state.subjects.length + 1, name: n, icon: i }); alert(`✨ Matéria "${n}" cadastrada!`); document.getElementById('subject_name').value = ''; document.getElementById('subject_icon').value = '📚'; render(); }
function deleteSubject(id) { const s = state.subjects.find(s => s.id === id); if (confirm(`Excluir "${s.name}"?`)) { state.tasks = state.tasks.filter(t => t.subject !== id); state.subjects = state.subjects.filter(s => s.id !== id); alert('Excluído!'); render(); } }
function addTeacher() { const n = document.getElementById('teacher_name')?.value, cpf = document.getElementById('teacher_cpf')?.value, e = document.getElementById('teacher_email')?.value, p = document.getElementById('teacher_password')?.value, subSel = document.getElementById('teacher_subjects'), clsSel = document.getElementById('teacher_classes'); if (!n || !cpf || !e || !p) { alert('Preencha todos os campos!'); return; } if (state.teachers.some(t => t.cpf === cpf)) { alert('CPF já existe!'); return; } const subs = Array.from(subSel.selectedOptions).map(o => parseInt(o.value)), cls = Array.from(clsSel.selectedOptions).map(o => o.value); if (subs.length === 0 || cls.length === 0) { alert('Selecione matérias e turmas!'); return; } state.teachers.push({ id: state.teachers.length + 1, name: n, cpf, email: e, password: p, subjects: subs, classes: cls }); alert(`Professor ${n} cadastrado!`); document.getElementById('teacher_name').value = ''; document.getElementById('teacher_cpf').value = ''; document.getElementById('teacher_email').value = ''; document.getElementById('teacher_password').value = ''; Array.from(subSel.options).forEach(o => o.selected = false); Array.from(clsSel.options).forEach(o => o.selected = false); render(); }
function deleteTeacher(id) { const t = state.teachers.find(t => t.id === id); if (confirm(`Excluir "${t.name}"?`)) { state.teachers = state.teachers.filter(t => t.id !== id); alert('Excluído!'); render(); } }
function addClass() { const n = document.getElementById('new_class_name')?.value; if (!n) { alert('Digite o nome da turma!'); return; } if (state.availableClasses.includes(n)) { alert('Turma já existe!'); return; } state.availableClasses.push(n); alert(`Turma "${n}" criada!`); document.getElementById('new_class_name').value = ''; render(); }
function deleteClass(cn) { const count = state.students.filter(s => s.class === cn).length; if (count > 0) { alert(`Turma tem ${count} aluno(s)!`); return; } if (confirm(`Excluir "${cn}"?`)) { state.availableClasses = state.availableClasses.filter(c => c !== cn); alert('Excluída!'); render(); } }
function addStudent() { const ra = document.getElementById('student_ra')?.value, n = document.getElementById('student_name')?.value, p = document.getElementById('student_password')?.value, cls = document.getElementById('student_class')?.value, av = document.getElementById('student_avatar')?.value; if (!ra || !n || !p || !cls || !av) { alert('Preencha todos os campos!'); return; } if (state.students.some(s => s.ra === ra)) { alert('RA já existe!'); return; } state.students.push({ ra, name: n, level: 1, xp: 0, xpToNextLevel: 100, class: cls, avatarName: av, title: 'initiate', customTitle: '', password: p, charData: { gender: 'female', hairStyle: 'short', hairColor: '#8B5CF6', skinTone: '#FFD93D', outfitStyle: 'basic', outfitColor: '#8B5CF6', accessory: 'none' }, tasksDone: [], tasksPending: [], achievements: [], answers: {} }); alert(`Aluno ${n} matriculado!`); document.getElementById('student_ra').value = ''; document.getElementById('student_name').value = ''; document.getElementById('student_password').value = ''; document.getElementById('student_avatar').value = ''; render(); }
function deleteStudent(ra) { const s = state.students.find(s => s.ra === ra); if (confirm(`Excluir "${s.name}"?`)) { state.students = state.students.filter(s => s.ra !== ra); alert('Excluído!'); render(); } }

// TEACHER FUNCTIONS
function saveMissionAndContinue() { const t = document.getElementById('mission_title')?.value, s = parseInt(document.getElementById('mission_subject')?.value), c = document.getElementById('mission_class')?.value, b = parseInt(document.getElementById('mission_bimester')?.value), w = parseInt(document.getElementById('mission_week')?.value); if (!t) { alert('Digite o título!'); return; } state.currentMission = { ...state.currentMission, title: t, subject: s, class: c, bimester: b, week: w }; state.selectedSubject = s; state.selectedBimester = b; state.selectedWeek = w; navigate('teacher_create_questions'); }
function addQuestion() { const qt = document.getElementById('question_text')?.value, opts = [document.getElementById('option_0')?.value, document.getElementById('option_1')?.value, document.getElementById('option_2')?.value, document.getElementById('option_3')?.value], ca = parseInt(document.querySelector('input[name="correct_answer"]:checked')?.value || 0), d = document.getElementById('question_difficulty')?.value; if (!qt || opts.some(o => !o)) { alert('Preencha pergunta e alternativas!'); return; } state.currentMission.questions.push({ q: qt, options: opts, correct: ca, difficulty: d }); state.currentMission.xp = calculateXP(state.currentMission.questions); document.getElementById('question_text').value = ''; ['option_0', 'option_1', 'option_2', 'option_3'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; }); const radio = document.querySelector('input[name="correct_answer"][value="0"]'); if (radio) radio.checked = true; render(); }
function removeQuestion(i) { state.currentMission.questions.splice(i, 1); state.currentMission.xp = calculateXP(state.currentMission.questions); render(); }
function finishMission() { if (state.currentMission.questions.length === 0) { alert('Adicione pelo menos uma pergunta!'); return; } const newTask = { id: state.tasks.length + 1, title: state.currentMission.title, subject: state.currentMission.subject, class: state.currentMission.class, bimester: state.currentMission.bimester, week: state.currentMission.week, xp: state.currentMission.xp, questions: [...state.currentMission.questions], teacherId: state.user?.id || 1 }; state.tasks.push(newTask); alert(`Missão "${newTask.title}" criada!`); clearCurrentMission(); navigate('teacher_week'); }
function saveMissionDirectly() { const t = document.getElementById('mission_title')?.value; if (!t) { alert('Digite o título!'); return; } if (confirm('Salvar sem perguntas?')) { const s = parseInt(document.getElementById('mission_subject')?.value), c = document.getElementById('mission_class')?.value, b = parseInt(document.getElementById('mission_bimester')?.value), w = parseInt(document.getElementById('mission_week')?.value); state.tasks.push({ id: state.tasks.length + 1, title: t, subject: s, class: c, bimester: b, week: w, xp: 0, questions: [], teacherId: state.user?.id || 1 }); alert('Missão salva!'); clearCurrentMission(); navigate('teacher_week'); } }
function submitTask(taskId) { const task = state.tasks.find(t => t.id === taskId); if (!task) return; let correct = 0; const answers = {}; task.questions.forEach((q, i) => { const selected = document.querySelector(`input[name="q_${i}"]:checked`); const answerValue = selected ? parseInt(selected.value) : -1; answers[i] = answerValue; if (selected && parseInt(selected.value) === q.correct) correct++; }); const earned = Math.round((correct / task.questions.length) * task.xp); const student = state.user; if (student) { if (!student.answers) student.answers = {}; student.answers[taskId] = answers; student.xp += earned; while (student.xp >= student.xpToNextLevel) { student.xp -= student.xpToNextLevel; student.level++; student.xpToNextLevel = Math.round(student.xpToNextLevel * 1.5); } if (student.tasksPending) student.tasksPending = student.tasksPending.filter(id => id !== taskId); if (!student.tasksDone) student.tasksDone = []; if (!student.tasksDone.includes(taskId)) student.tasksDone.push(taskId); } alert(`Missão concluída! +${earned} XP`); navigate('student_home'); }
function saveStudentProfile() { const s = state.user; if (!s) return; const newAvatar = document.getElementById('profile_avatar_name')?.value, newTitle = document.getElementById('profile_title')?.value, newCustom = document.getElementById('profile_custom_title')?.value; if (newAvatar && newAvatar.trim()) s.avatarName = newAvatar.trim(); if (newTitle === 'custom') { if (newCustom && newCustom.trim()) { s.customTitle = newCustom.trim(); s.title = 'custom'; } } else { s.title = newTitle; s.customTitle = ''; } alert('Perfil atualizado!'); navigate('student_profile'); }
function saveCharCustomization() { alert('Personagem atualizado!'); navigate('student_home'); }
function viewStudentAnswers(studentRa, taskId) { state.selectedStudentRa = studentRa; state.selectedMissionForAnswers = taskId; navigate('teacher_student_answers'); }

// RENDER ADMIN

orm></div><button onclick="finishMission()" class="w-full magic-bg text-white py-4 rounded-xl font-bold">🎯 FINALIZAR (${m.questions.length} questões | ${m.xp} XP)</button></div>`; }

// NOVA TELA: Ver Respostas do Aluno
function renderTeacherStudentAnswers() { const s = state.students.find(s => s.ra === state.selectedStudentRa); const task = state.tasks.find(t => t.id === state.selectedMissionForAnswers); if (!s || !task) return '<p>Dados não encontrados</p>'; const answers = s.answers?.[task.id] || {}; let correctCount = 0; task.questions.forEach((q, i) => { if (answers[i] === q.correct) correctCount++; }); return `<div class="min-h-screen pb-20"><header class="magic-bg text-white p-6"><button onclick="navigate('teacher_student_detail')" class="mb-4 text-white">← Voltar ao Aluno</button><div class="flex items-center gap-4"><div class="w-16 h-16 bg-white rounded-full p-1">${getCharSVG(s.charData)}</div><div><h1 class="text-2xl font-bold">${s.avatarName}</h1><p class="text-purple-200">${task.title}</p></div></div></header><main class="p-6"><div class="bg-white/90 rounded-xl p-6 mb-6"><h3 class="font-bold mb-2">📊 Resultado da Missão</h3><div class="grid grid-cols-3 gap-4 text-center"><div><p class="text-3xl font-bold text-purple-600">${correctCount}</p><p class="text-xs">Acertos</p></div><div><p class="text-3xl font-bold text-pink-600">${task.questions.length - correctCount}</p><p class="text-xs">Erros</p></div><div><p class="text-3xl font-bold text-green-600">${Math.round((correctCount/task.questions.length)*100)}%</p><p class="text-xs">Aproveitamento</p></div></div></div><h2 class="text-xl font-bold mb-4">📝 Respostas do Aluno</h2>${task.questions.map((q, i) => { const isCorrect = answers[i] === q.correct; const studentAnswer = answers[i] !== undefined ? q.options[answers[i]] : 'Não respondida'; return `<div class="bg-white/90 p-6 rounded-xl shadow-lg mb-4 ${isCorrect ? 'correct-answer' : 'wrong-answer'}"><div class="flex justify-between items-start mb-3"><h3 class="font-bold text-lg">Questão ${i+1}</h3><span class="px-3 py-1 rounded-full text-sm font-bold ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${isCorrect ? '✓ Correta' : '✗ Incorreta'}</span></div><p class="mb-4 text-gray-700">${q.q}</p><div class="grid grid-cols-2 gap-3 mb-4"><div class="p-3 bg-gray-50 rounded-lg"><p class="text-xs text-gray-500 mb-1">📌 Resposta do Aluno:</p><p class="font-semibold ${isCorrect ? 'text-green-700' : 'text-red-700'}">${studentAnswer}</p></div><div class="p-3 bg-green-50 rounded-lg"><p class="text-xs text-gray-500 mb-1">✅ Resposta Correta:</p><p class="font-semibold text-green-700">${q.options[q.correct]}</p></div></div><div class="text-sm text-gray-500">💡 Dica: ${q.difficulty === 'easy' ? 'Questão fácil - conceito básico' : q.difficulty === 'medium' ? 'Questão média - requer atenção' : 'Questão difícil - desafio avançado'}</div></div>`; }).join('')}<button onclick="navigate('teacher_student_detail')" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold mt-4">← Voltar para o Aluno</button></main></div>`; }

function renderStudentTasks() { const s = state.user || state.students[0]; const pending = state.tasks.filter(t => s.tasksPending?.includes(t.id)), done = state.tasks.filter(t => s.tasksDone?.includes(t.id)); return `<div class="min-h-screen pb-20"><header class="bg-white/95 p-4"><button onclick="navigate('student_home')" class="mb-2 text-purple-600">← Voltar</button><h1 class="text-2xl font-bold">📋 Minhas Missões</h1></header><div class="p-4"><h2 class="font-bold mb-3">📝 Pendentes (${pending.length})</h2>${pending.map(t => `<div onclick="state.selectedTaskId=${t.id}; navigate('student_do_task')" class="bg-white/90 p-4 rounded-xl shadow-lg cursor-pointer mb-3 border-l-4 border-purple-500"><div class="flex justify-between"><div><div class="font-bold">${t.title}</div><div class="text-sm">${getSubjectName(t.subject)}</div></div><span class="xp-badge text-white px-3 py-1 rounded-full text-sm">+${t.xp} XP</span></div></div>`).join('')}<h2 class="font-bold mb-3 mt-6">✅ Concluídas (${done.length})</h2>${done.map(t => `<div class="bg-white/90 p-4 rounded-xl shadow-lg mb-3 border-l-4 border-green-500 opacity-85"><div class="font-bold">${t.title}</div><div class="text-sm">${getSubjectName(t.subject)} | +${t.xp} XP</div></div>`).join('')}</div><nav class="fixed bottom-0 w-full bg-white/95 border-t flex justify-around py-3"><button onclick="navigate('student_home')" class="text-gray-400">🏠</button><button onclick="navigate('student_tasks')" class="text-purple-600">📋</button><button onclick="navigate('student_customize')" class="text-gray-400">✨</button><button onclick="navigate('student_profile')" class="text-gray-400">👤</button></nav></div>`; }
function renderDoTask() { const t = state.tasks.find(t => t.id === state.selectedTaskId); if (!t) return '<p>Missão não encontrada</p>'; return `<div class="min-h-screen pb-20"><header class="bg-white/95 p-4"><button onclick="navigate('student_tasks')" class="mb-2 text-purple-600">← Voltar</button><h1 class="text-2xl font-bold">✨ ${t.title}</h1><span class="xp-badge text-white px-3 py-1 rounded-full text-sm">+${t.xp} XP</span></header><div class="p-4"><form onsubmit="event.preventDefault(); submitTask(${t.id})">${t.questions.map((q, i) => `<div class="bg-white/90 p-6 rounded-xl shadow-lg mb-4"><h3 class="font-bold mb-3">Q${i+1}</h3><p class="mb-4">${q.q}</p>${q.options.map((opt, oi) => `<label class="flex items-center p-3 border rounded-lg cursor-pointer mb-2"><input type="radio" name="q_${i}" value="${oi}" class="mr-3" required>${opt}</label>`).join('')}</div>`).join('')}<button type="submit" class="w-full magic-bg text-white py-4 rounded-xl font-bold">✨ ENTREGAR ✨</button></form></div></div>`; }
function renderStudentCustomize() { const s = state.user || state.students[0]; const tab = state.activeCustomizationTab; return `<div class="min-h-screen pb-20"><header class="bg-white/95 p-6"><div class="flex justify-between"><button onclick="navigate('student_home')" class="text-purple-600">← Voltar</button><h1 class="text-2xl font-bold">✨ Customizar</h1><button onclick="saveCharCustomization()" class="magic-bg text-white px-4 py-2 rounded-lg">💾 Salvar</button></div></header><div class="p-4"><div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-2xl p-8 mb-6 flex justify-center"><div class="animate-float">${getDetailedCharSVG(s.charData, 200)}</div></div><div class="bg-white/90 rounded-xl shadow-lg mb-4"><div class="flex border-b"><button onclick="state.activeCustomizationTab='hair'; render()" class="flex-1 py-3 ${tab === 'hair' ? 'text-purple-600 font-bold border-b-2 border-purple-600' : ''}">💇 Cabelo</button><button onclick="state.activeCustomizationTab='outfit'; render()" class="flex-1 py-3 ${tab === 'outfit' ? 'text-purple-600 font-bold border-b-2 border-purple-600' : ''}">👔 Roupa</button><button onclick="state.activeCustomizationTab='accessory'; render()" class="flex-1 py-3 ${tab === 'accessory' ? 'text-purple-600 font-bold border-b-2 border-purple-600' : ''}">⚔️ Acessório</button></div></div>${tab === 'hair' ? `<div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">Estilo</h3><div class="grid grid-cols-3 gap-2 mb-4">${state.hairStyles.map(style => `<button onclick="s.charData.hairStyle='${style.id}'; render()" class="p-3 rounded-lg border-2 text-center ${s.charData.hairStyle === style.id ? 'border-purple-600 bg-purple-50' : ''}"><span class="text-2xl">${style.icon}</span><span class="text-xs">${style.name}</span></button>`).join('')}</div><h3 class="font-bold mb-3">Cor</h3><div class="flex flex-wrap gap-2">${state.hairColors.map(c => `<button onclick="s.charData.hairColor='${c}'; render()" class="w-10 h-10 rounded-full border-2 ${s.charData.hairColor === c ? 'border-purple-600 scale-110' : ''}" style="background:${c}"></button>`).join('')}</div></div>` : tab === 'outfit' ? `<div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">Estilo</h3><div class="grid grid-cols-2 gap-2 mb-4">${state.outfitStyles.map(style => `<button onclick="s.charData.outfitStyle='${style.id}'; render()" class="p-3 rounded-lg border-2 text-center ${s.charData.outfitStyle === style.id ? 'border-purple-600 bg-purple-50' : ''}"><span class="text-2xl">${style.icon}</span><span class="text-sm">${style.name}</span></button>`).join('')}</div><h3 class="font-bold mb-3">Cor</h3><div class="flex flex-wrap gap-2">${state.outfitColors.map(c => `<button onclick="s.charData.outfitColor='${c}'; render()" class="w-10 h-10 rounded-full border-2 ${s.charData.outfitColor === c ? 'border-purple-600 scale-110' : ''}" style="background:${c}"></button>`).join('')}</div></div>` : `<div class="bg-white/90 rounded-xl p-4"><div class="grid grid-cols-3 gap-2">${state.accessories.map(acc => `<button onclick="s.charData.accessory='${acc.id}'; render()" class="p-4 rounded-lg border-2 text-center ${s.charData.accessory === acc.id ? 'border-purple-600 bg-purple-50' : ''}"><span class="text-3xl">${acc.icon}</span><span class="text-xs">${acc.name}</span></button>`).join('')}</div></div>`}</div><nav class="fixed bottom-0 w-full bg-white/95 border-t flex justify-around py-3"><button onclick="navigate('student_home')" class="text-gray-400">🏠</button><button onclick="navigate('student_tasks')" class="text-gray-400">📋</button><button onclick="navigate('student_customize')" class="text-purple-600">✨</button><button onclick="navigate('student_profile')" class="text-gray-400">👤</button></nav></div>`; }
function renderStudentProfile() { const s = state.user || state.students[0]; const progress = Math.min((s.xp / s.xpToNextLevel) * 100, 100); const available = state.availableTitles.filter(t => t.minLevel <= s.level); const titleDisplay = getFullTitle(s); return `<div class="min-h-screen pb-20"><header class="magic-bg text-white p-6"><div class="flex justify-between"><h1 class="text-2xl font-bold">👤 Meu Perfil</h1><button onclick="handleLogout()" class="bg-red-500 px-4 py-2 rounded-lg">SAIR</button></div><div class="flex items-center gap-4 mt-4"><div class="w-20 h-20 bg-white rounded-full p-1">${getCharSVG(s.charData)}</div><div><h2 class="text-xl font-bold">${s.avatarName}</h2><p class="text-purple-200">${s.name}</p><div><span class="bg-white/20 px-2 py-0.5 rounded-full text-xs">Nível ${s.level}</span><span class="bg-white/20 px-2 py-0.5 rounded-full text-xs ml-2 animate-title-glow">${titleDisplay}</span></div></div></div></header><div class="p-4 space-y-4"><div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">📋 Informações</h3><div class="space-y-2 text-sm"><div class="flex justify-between"><span>Nome:</span><span class="font-bold">${s.name}</span></div><div class="flex justify-between"><span>RA:</span><span class="font-bold">${s.ra}</span></div><div class="flex justify-between"><span>Turma:</span><span class="font-bold">${s.class}</span></div></div></div><div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">⭐ Progresso</h3><div class="flex justify-between text-sm mb-2"><span>${s.xp} / ${s.xpToNextLevel} XP</span><span>${progress.toFixed(0)}%</span></div><div class="w-full bg-purple-200 rounded-full h-3"><div class="magic-bg h-3 rounded-full" style="width: ${progress}%"></div></div></div><div class="bg-white/90 rounded-xl p-4"><h3 class="font-bold mb-3">✨ Personalização</h3><div class="space-y-4"><div><label class="block text-sm font-bold mb-2">🎭 Nome do Avatar</label><input type="text" id="profile_avatar_name" value="${s.avatarName}" class="w-full p-3 border rounded-lg"></div><div><label class="block text-sm font-bold mb-2">🏆 Título</label><select id="profile_title" class="w-full p-3 border rounded-lg"><option value="">Selecione</option>${available.map(t => `<option value="${t.id}" ${s.title === t.id && !s.customTitle ? 'selected' : ''}>${t.icon} ${t.name}</option>`).join('')}<option value="custom" ${s.title === 'custom' ? 'selected' : ''}>✨ Personalizado</option></select></div><div id="custom_title_container" style="${s.title === 'custom' ? 'display:block' : 'display:none'}"><label class="block text-sm font-bold mb-2">✏️ Título Personalizado</label><input type="text" id="profile_custom_title" value="${s.customTitle || ''}" placeholder="Ex: Guardião das Estrelas" class="w-full p-3 border rounded-lg"></div><button onclick="saveStudentProfile()" class="btn-magic text-white px-6 py-3 rounded-lg font-bold w-full">💾 SALVAR</button></div></div></div><nav class="fixed bottom-0 w-full bg-white/95 border-t flex justify-around py-3"><button onclick="navigate('student_home')" class="text-gray-400">🏠</button><button onclick="navigate('student_tasks')" class="text-gray-400">📋</button><button onclick="navigate('student_customize')" class="text-gray-400">✨</button><button onclick="navigate('student_profile')" class="text-purple-600">👤</button></nav></div>`; }

function renderLogin() { return `<div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-100 via-purple-100 to-pink-100"><div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-2xl w-full max-w-md animate-magic-glow"><div class="text-center mb-8"><div class="text-6xl mb-4 animate-float">🎮✨</div><h1 class="text-4xl font-bold magic-bg bg-clip-text text-transparent mb-2">EduQuest</h1><p class="text-gray-600">A aventura mágica do conhecimento!</p></div><div class="flex mb-6 space-x-2"><button onclick="state.userType='student'; render()" class="flex-1 py-3 rounded-lg font-bold transition-all ${state.userType === 'student' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg' : 'bg-gray-100 text-gray-600'}">🎒 Aluno</button><button onclick="state.userType='teacher'; render()" class="flex-1 py-3 rounded-lg font-bold transition-all ${state.userType === 'teacher' ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg' : 'bg-gray-100 text-gray-600'}">👨‍🏫 Professor</button></div><div class="space-y-4"><input type="text" id="login_id" placeholder="${state.userType === 'teacher' ? 'CPF' : 'RA'}" class="w-full p-3 border-2 border-purple-200 rounded-lg"><input type="password" id="login_pass" placeholder="Senha" class="w-full p-3 border-2 border-purple-200 rounded-lg"><button onclick="handleLogin()" class="w-full magic-bg text-white py-4 rounded-lg font-bold text-lg">✨ ENTRAR ✨</button></div><div class="mt-6 p-4 bg-purple-50 rounded-lg text-xs"><p class="font-bold">🔮 Credenciais:</p><p>👩‍🎓 Aluno: RA 123 | Senha 123</p><p>👨‍🏫 Professor: CPF 123.456.789-00 | Senha 123456</p><p><a href="#" onclick="navigate('admin_login')" class="text-purple-600">🔧 Área Admin</a></p></div></div></div>`; }
function renderAdminLogin() { return `<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white/90 backdrop-blur-sm p-8 rounded-2xl shadow-xl w-full max-w-md"><h1 class="text-2xl font-bold text-center mb-6 magic-bg bg-clip-text text-transparent">Admin EduQuest</h1><div class="space-y-4"><input type="email" id="admin_email" placeholder="E-mail" class="w-full p-3 border rounded-lg"><input type="password" id="admin_pass" placeholder="Senha" class="w-full p-3 border rounded-lg"><button onclick="handleAdminLogin()" class="w-full magic-bg text-white py-3 rounded-lg font-bold">ENTRAR</button></div><button onclick="navigate('login')" class="mt-4 text-gray-500">← Voltar</button></div></div>`; }

function render() { const app = document.getElementById('app'); if (!app) return; const views = { login: renderLogin, admin_login: renderAdminLogin, admin_dashboard: renderAdminDashboard, teacher_home: renderTeacherHome, teacher_subject: renderTeacherSubject, teacher_bimester: renderTeacherBimester, teacher_week: renderTeacherWeek, teacher_create_task: renderCreateTask, teacher_create_questions: renderCreateQuestions, teacher_task_detail: renderTaskDetail, teacher_classes: renderTeacherClasses, teacher_student_detail: renderTeacherStudentDetail, teacher_student_answers: renderTeacherStudentAnswers, student_home: renderStudentHome, student_tasks: renderStudentTasks, student_do_task: renderDoTask, student_customize: renderStudentCustomize, student_profile: renderStudentProfile }; app.innerHTML = views[state.currentView] ? views[state.currentView]() : renderLogin(); const titleSelect = document.getElementById('profile_title'); if (titleSelect) titleSelect.onchange = function() { const ct = document.getElementById('custom_title_container'); if (ct) ct.style.display = this.value === 'custom' ? 'block' : 'none'; }; }

window.state = state; window.navigate = navigate; window.handleLogin = handleLogin; window.handleAdminLogin = handleAdminLogin; window.handleLogout = handleLogout;
